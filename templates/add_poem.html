{% extends "base.html" %}
{% block title %}Add Poem — The Poetry House{% endblock %}
{% block content %}
<pre class="floor-plan">ADD POEM TO NOTEBOOK
====================</pre>

<form method="POST" class="auth-form" style="max-width:600px">
  <div class="form-group">
    <label for="title">title *</label>
    <input type="text" id="title" name="title" autofocus>
  </div>
  <div class="form-group">
    <label for="author_name">author</label>
    <input type="text" id="author_name" name="author_name">
  </div>
  <div class="form-group">
    <label for="body">poem text *</label>
    <textarea id="body" name="body" rows="20" style="min-height:300px"
              placeholder="paste or type the poem here..."></textarea>
  </div>
  <div class="form-group">
    <label for="period">period / movement</label>
    <input type="text" id="period" name="period" placeholder="e.g. Romantics">
  </div>
  <div class="form-group">
    <label for="year_written">year written</label>
    <input type="text" id="year_written" name="year_written" placeholder="e.g. 1819">
  </div>
  <button type="submit" class="btn">add to notebook</button>
  <a href="{{ url_for('notebook') }}" class="btn btn-muted">cancel</a>
</form>
{% endblock %}
