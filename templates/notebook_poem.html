{% extends "base.html" %}
{% block title %}{{ poem.title }} — Notebook{% endblock %}
{% block content %}

<h2>{{ poem.title }}</h2>
{% if poem.author_name %}<p class="byline">by {{ poem.author_name }}</p>{% endif %}

<div class="poem">{{ poem.body }}</div>

<p>
  <a href="{{ url_for('learn', poem_id=poem.id) }}">Begin learning</a> |
  <a href="{{ url_for('learn_stanzas', poem_id=poem.id) }}">Learn in parts</a>
</p>

<h3>Notes</h3>
<form method="POST">
  <textarea name="notes" rows="6">{{ entry.notes or '' }}</textarea>
  <button type="submit">Save notes</button>
</form>

<p><a href="{{ url_for('notebook') }}">Back to the notebook</a></p>

{% endblock %}
