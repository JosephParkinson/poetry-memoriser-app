{% extends "base.html" %}
{% block title %}Memorise Poetry{% endblock %}
{% block content %}

<div class="centered">
  <form method="GET" action="{{ url_for('library') }}">
    <input type="text" name="q" class="search-box" placeholder="Search for Poems by author or title">
    <button type="submit">Search</button>
  </form>

  <p><a href="{{ url_for('library') }}">Browse</a></p>
</div>

{% endblock %}
