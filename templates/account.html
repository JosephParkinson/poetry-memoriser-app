{% extends "base.html" %}
{% block title %}My Account — The Poetry House{% endblock %}
{% block content %}

<h2>My Account</h2>

<dl>
  <dt><a href="{{ url_for('notebook') }}">Favourites</a></dt>
  <dd>Poems you have saved, with your learning progress.</dd>

  <dt><a href="{{ url_for('archive') }}">Completed Poems</a></dt>
  <dd>Poems you have recited in full from memory.</dd>
</dl>

<p><a href="{{ url_for('logout') }}">Log out ({{ session.username }})</a></p>

{% endblock %}
