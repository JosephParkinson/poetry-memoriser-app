{% extends "base.html" %}
{% block title %}Library — The Poetry House{% endblock %}
{% block content %}

<h2>Library</h2>

<p>Books are shelved by period.</p>

<ul>
  {% for label, period in shelves %}
  <li><a href="{{ url_for('library_shelf', period=period) }}">{{ label }}</a></li>
  {% endfor %}
</ul>

{% endblock %}
